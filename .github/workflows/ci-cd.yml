# ivandev CI/CD: lint, tests con cobertura y build en paralelo; deploy a Cloudflare Pages solo en push a main
name: ivandev CI/CD

# Disparadores: pushes y pull requests a las ramas principales
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancela ejecuciones previas del mismo ref para no gastar minutos de CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos: solo lectura del repositorio
permissions:
  contents: read

jobs:
  # Job 1: verificación de formato y lint con Biome (read-only, falla si hay problemas)
  lint:
    name: Biome
    runs-on: [self-hosted, linux, arm64]
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Lint y formato en una sola pasada, sin escribir archivos
      - name: Biome CI
        run: bunx biome ci .

  # Job 2: pruebas unitarias con cobertura — paralelo a lint
  test:
    name: Tests & Coverage
    runs-on: [self-hosted, linux, arm64]
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Ejecuta la suite con reporte de cobertura
      - name: Run tests with coverage
        run: bun run test:coverage

      # 4. Publica el reporte HTML para revisarlo desde el run
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Job 3: typecheck y build de producción en cada push y PR
  build:
    name: Build & Typecheck
    runs-on: [self-hosted, linux, arm64]
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Compila (tsc -b + vite build) sin necesidad de secretos
      - name: Build project
        run: bun run build

  # Job 4: despliegue a Cloudflare Pages (solo push a main y con todo verde)
  deploy:
    name: Deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test, build]
    runs-on: [self-hosted, linux, arm64]
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Compila con Turnstile de producción
      - name: Build for production
        run: bun run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      # 4. Despliega el build a Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy dist/ --project-name=portafolio-web --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ---------------------------------------------------------------------------
  # Escaneo de secretos. Workflow reutilizable definido en ivndv/.github
  # ---------------------------------------------------------------------------
  gitleaks:
    uses: ivndv/.github/.github/workflows/gitleaks.yml@main
